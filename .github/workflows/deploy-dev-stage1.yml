name: Deploy Dev Environment - Stage 1 (Foundation)

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      auto_apply:
        description: 'Auto-apply after plan approval (if GitHub Environment protection rules allow)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  # ============================================================================
  # STEP 0: PRE-COMMIT QUALITY & SECURITY CHECKS
  # ============================================================================
  precommit:
    name: Pre-commit Quality & Security Checks
    uses: ./.github/workflows/dpl-01-precommit.yml
    secrets: inherit

  # ============================================================================
  # STEP 1: STAGE 1 PLAN (ACCOUNT PLANE FOUNDATION)
  # Targets KMS keys, backend bucket, cross-account IAM role, MWS networking,
  # root storage buckets, and generic Databricks workspaces.
  # ============================================================================
  plan_stage1:
    name: Stage 1 Plan (Foundation)
    needs: [ precommit ]
    uses: ./.github/workflows/dpl-02-plan-stage1.yml
    secrets: inherit
    with:
      working_directory: 'environments/dev'
      environment: 'dev'
      plan_artifact_name: 'dev-stage1-tfplan'

  # ============================================================================
  # STEP 2: STAGE 1 APPLY (ACCOUNT PLANE FOUNDATION)
  # Gated by GitHub Environment "dev" manual approval on main branch.
  # ============================================================================
  apply_stage1:
    name: Stage 1 Apply (Foundation)
    needs: [ plan_stage1 ]
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/dpl-03-apply-stage1.yml
    secrets: inherit
    with:
      working_directory: 'environments/dev'
      environment: 'dev'
      plan_artifact_name: 'dev-stage1-tfplan'
